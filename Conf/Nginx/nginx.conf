worker_processes auto;
worker_rlimit_nofile 51200;

stream {
    log_format tcp_format '$time_local|$remote_addr|$protocol|$status|$bytes_sent|$bytes_received|$session_time|$upstream_addr|$upstream_bytes_sent|$upstream_bytes_received|$upstream_connect_time';  
    access_log off;
    error_log off;
    include /www/server/panel/vhost/nginx/tcp/*.conf;
    # 转发内网50022，gitlab ssh端口
    upstream ssh {
        server 127.0.0.1:50022;
    }
    server {
        listen 66;
        proxy_pass ssh;
        proxy_connect_timeout 1h;
    		proxy_timeout 1h;
    }
}

events
{
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http
{
    include mime.types;
    default_type application/octet-stream;
    
    server {
        listen 80 default_server;
        server_name ltpp.vip;
        default_type application/octet-stream;
        index index.html;
        root /home/LTPP/Frontend/frontend/;
        access_log off;
        error_log  off;
        return 301 https://$host$request_uri;
    }

    server
    {
        listen 443 ssl http2 default_server;
        server_name ltpp.vip;
        index index.html;
        access_log off;
        error_log  off;
        root /home/LTPP/Frontend/frontend/;
        try_files $uri $uri/ /index.html;
        ssl_certificate /home/LTPP/Frontend/ssl/ltpp/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/ltpp/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1h;
        ssl_buffer_size 1024k;
        add_header Strict-Transport-Security max-age=88888888;
        ssl_stapling on;
        ssl_stapling_verify on;
        access_log off;
        default_type application/octet-stream;
        include enable-php-00.conf;
        include /www/server/panel/vhost/rewrite/ltpp.vip.conf;
        
        # 重定向
        return 301 https://www.ltpp.vip$request_uri;
        
        location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
        {
            return 404;
        }
        location ~ \.well-known{
            allow all;
        }
        if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
            return 403;
        }
        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
            expires      30d;
            error_log /dev/null;
            access_log /dev/null;
        }
        location ~ .*\.(js|css)?$
        {
            expires      12h;
            error_log /dev/null;
            access_log /dev/null;
        }
    }

    server {
        listen 80;
        server_name api.ltpp.vip;
        default_type application/octet-stream;
