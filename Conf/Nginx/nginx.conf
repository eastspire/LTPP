        ssl_certificate /home/LTPP/Frontend/ssl/pages-children/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/pages-children/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1h;
        ssl_buffer_size 1024k;
        add_header Strict-Transport-Security max-age=88888888;
        ssl_stapling on;
        ssl_stapling_verify on;
        access_log off;
        default_type application/octet-stream;
        location / {
            proxy_pass http://127.0.0.1:50080;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade-Insecure-Requests 1;
            proxy_max_temp_file_size 2048m;
            proxy_buffering  on;
            proxy_buffer_size 128m;
            proxy_buffers 4 128m;
            proxy_busy_buffers_size 128m;
            proxy_temp_file_write_size 1024m;
            proxy_set_header connection keep-alive;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }
    }
}
