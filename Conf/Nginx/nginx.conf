worker_processes auto;

events
{
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http
{
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost www.ltpp.vip;
        default_type application/octet-stream;
        index index.html;
        root /home/LTPP/Frontend/frontend;
        return 301 https://$host$request_uri;
    }

    server
    {
        listen 443 ssl http2;
        server_name ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost www.ltpp.vip;
        index index.html;
        root /home/LTPP/Frontend/frontend;
        try_files $uri $uri/ /index.html;
        #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
        #error_page 404/404.html;
        #SSL-END
        ssl_certificate /home/LTPP/Frontend/ssl/frontend/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/frontend/privkey.pem;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1h;
        ssl_buffer_size 4k;
        add_header Strict-Transport-Security max-age=88888888;
        ssl_stapling on;
        ssl_stapling_verify on;
        access_log off;
        default_type application/octet-stream;
        #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
        #error_page 404 /404.html;
        #error_page 502 /502.html;
        #ERROR-PAGE-END

        #PHP-INFO-START  PHP引用配置，可以注释或修改
        include enable-php-00.conf;
        #PHP-INFO-END

        #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
        include /www/server/panel/vhost/rewrite/ltpp.vip.conf;
        #REWRITE-END

        #禁止访问的文件或目录
        location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
        {
            return 404;
        }

        #一键申请SSL证书验证目录相关设置
        location ~ \.well-known{
            allow all;
        }

        #禁止在证书验证目录放入敏感文件
        if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
            return 403;
        }

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
            expires      30d;
            error_log /dev/null;
            access_log /dev/null;
        }

        location ~ .*\.(js|css)?$
        {
            expires      12h;
            error_log /dev/null;
            access_log /dev/null;
        }

        error_log  /www/wwwlogs/ltpp.vip.error.log;
    }

    server {
        listen 80;
        server_name api.ltpp.vip;
        default_type application/octet-stream;
        index index.html;
        root /home/LTPP/Frontend/api;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.ltpp.vip;
        index index.html;
        root /home/LTPP/Frontend/api;
        ssl_certificate /home/LTPP/Frontend/ssl/api/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/api/privkey.pem;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1h;
        ssl_buffer_size 4k;
        add_header Strict-Transport-Security max-age=88888888;
        ssl_stapling on;
        ssl_stapling_verify on;
        access_log off;
        default_type application/octet-stream;
        location / {
            proxy_pass http://127.0.0.1:48787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect default;
            proxy_buffering off;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }
    }

    server {
