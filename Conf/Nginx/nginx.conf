worker_processes auto;

events
{
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http
{
    include mime.types;
    default_type application/octet-stream;
    server
    {
        listen 443 ssl;
        server_name ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost
        index index.html;
        root /home/LTPP/Frontend/frontend;
        try_files $uri $uri/ /index.html;
        ssl_certificate /home/LTPP/Frontend/ssl/frontend/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/frontend/privkey.pem;
        location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
        {
            return 404;
        }       
        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ 
        {
            expires      30d;
            error_log /dev/null;
            access_log /dev/null;
        }
        location ~ .*\.(js|css)?$
        {
            expires      30d;
            error_log /dev/null;
            access_log /dev/null;
        }
        access_log  /dev/null;
        error_log  /dev/null;
    }

    server
    {
        listen 443 ssl;
        server_name music.ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost;
        root /home/LTPP/Frontend/music;
        ssl_certificate /home/LTPP/Frontend/ssl/music/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/music/privkey.pem;
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        access_log  /dev/null;
        error_log  /dev/null;
    }

    server
    {
        listen 443 ssl;
        server_name wss.ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost;
        root /home/LTPP/Frontend/wss;
        ssl_certificate /home/LTPP/Frontend/ssl/websocket/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/websocket/privkey.pem;
        location / {
            proxy_pass http://127.0.0.1:47272;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        access_log  /dev/null;
        error_log  /dev/null;
    }

    server {
        listen 443 ssl;
        server_name api.ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost;
        root /home/LTPP/Frontend/api;
        ssl_certificate /home/LTPP/Frontend/ssl/backend/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/backend/privkey.pem;
        location / {
            proxy_pass http://127.0.0.1:48787;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        access_log  /dev/null;
        error_log  /dev/null;
    }

    server
    {
        listen 443 ssl;
        server_name api.ltpp.vip hbnuoj.ltpp.vip 127.0.0.1 localhost;
        root /home/LTPP/Frontend/email;
        ssl_certificate /home/LTPP/Frontend/ssl/email/fullchain.pem;
        ssl_certificate_key /home/LTPP/Frontend/ssl/email/privkey.pem;
        location / {
            proxy_pass http://127.0.0.1:40000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}